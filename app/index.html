<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Whoop</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#000; --card:#16171a; --card2:#1d1f23; --line:#2a2d32;
  --ink:#fff; --muted:#8b8f98; --dim:#5b5f67;
  --green:#16ec06; --yellow:#ffde00; --red:#ff3b46;
  --blue:#0093e7; --sleep:#7cc6f0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,ui-sans-serif,"Segoe UI",system-ui,sans-serif}
body{padding:max(10px,env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

/* ---------- kop ---------- */
.top{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:6px}
.mono{width:32px;height:32px;border:1.5px solid var(--muted);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:4px}
.nav b{font-size:12px;letter-spacing:.13em;font-weight:600;background:var(--card2);
  border-radius:99px;padding:7px 17px;min-width:104px;text-align:center}
.nav button{color:var(--muted);font-size:19px;padding:4px 9px;line-height:1}
.nav button[disabled]{opacity:.25}
.batt{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.batt i{width:12px;height:20px;border:1.5px solid var(--muted);border-radius:3px;
  position:relative;display:block}
.batt i b{position:absolute;left:1.5px;right:1.5px;bottom:1.5px;border-radius:1px;
  background:var(--green);display:block}
.batt i b.low{background:var(--yellow)}
.batt i b.crit{background:var(--red)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:26px;margin:10px 2px 20px;border-bottom:1px solid var(--line)}
.tabs button{font-size:12px;letter-spacing:.11em;font-weight:600;color:var(--dim);
  padding:0 0 11px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}

/* ---------- ringen ---------- */
.rings{display:flex;justify-content:space-between;align-items:flex-start;
  gap:4px;margin:14px 0 26px}
.rw{flex:1;text-align:center}
.rw svg{width:100%;max-width:112px;height:auto;display:block;margin:0 auto}
.rw .cap{font-size:10.5px;letter-spacing:.13em;color:var(--muted);margin-top:9px;font-weight:600}
.rw text.v{font-weight:700;letter-spacing:-.04em;fill:var(--ink)}
.rw text.p{fill:var(--muted);font-weight:600}

/* ---------- kaarten ---------- */
.card{background:var(--card);border-radius:14px;padding:17px 18px;margin-bottom:11px}
.card h3{font-size:11px;letter-spacing:.11em;color:var(--muted);margin:0 0 14px;font-weight:600}
.coach b{display:block;font-size:16.5px;margin-bottom:6px}
.coach p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}

/* ---------- gezondheid ---------- */
.hero{text-align:center;position:relative;padding:20px 0 26px}
.hero::before{content:"";position:absolute;left:-14px;right:-14px;top:50%;
  height:1px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:.55}
.bpm{width:112px;height:112px;border-radius:50%;background:var(--card);
  border:1px solid var(--line);margin:0 auto;display:flex;flex-direction:column;
  align-items:center;justify-content:center;position:relative;z-index:1}
.bpm .n{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.bpm .u{font-size:10px;letter-spacing:.12em;color:var(--muted);margin-top:3px}
.bpm .h{font-size:12px;color:var(--red);margin-bottom:1px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{background:var(--card);border-radius:14px;padding:15px 16px}
.tile .lab{font-size:10.5px;letter-spacing:.09em;color:var(--muted);font-weight:600;
  margin-bottom:9px;display:flex;align-items:center;gap:6px}
.tile .val{font-size:29px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.tile .val small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.tile .val.na{color:var(--dim);font-size:26px}
.badge{display:inline-block;margin-top:10px;font-size:11.5px;padding:4px 9px;border-radius:6px;
  background:rgba(22,236,6,.13);color:var(--green)}
.badge.warn{background:rgba(255,222,0,.13);color:var(--yellow)}
.badge.off{background:var(--card2);color:var(--dim)}

/* ---------- grafiek + week ---------- */
svg.chart{width:100%;height:120px;display:block;overflow:visible}
.chart .ln{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;
  stroke-linecap:round;vector-effect:non-scaling-stroke}
.chart .ar{fill:var(--blue);opacity:.13}
.chart text{fill:var(--dim);font-size:10px}
.week{display:flex;gap:5px;align-items:flex-end;height:72px}
.week div{flex:1;border-radius:4px;background:var(--card2);min-height:4px}
.wdays{display:flex;gap:5px;margin-top:8px}
.wdays span{flex:1;text-align:center;font-size:10px;color:var(--dim)}
.sub{font-size:12.5px;color:var(--muted);margin-top:10px}
.note{font-size:12px;color:var(--dim);line-height:1.5;margin:13px 0 0;
  padding-top:12px;border-top:1px solid var(--line)}

/* ---------- login ---------- */
form{display:flex;flex-direction:column;gap:11px}
input{font:inherit;background:var(--card2);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:13px 14px;width:100%}
input:focus{outline:none;border-color:var(--blue)}
.primary{background:var(--ink);color:#000;border-radius:11px;padding:13px;
  font-weight:600;text-align:center}
.err{color:var(--red);font-size:13.5px;min-height:19px}
.hide{display:none}
.center{text-align:center;color:var(--muted);padding:36px 12px;font-size:14.5px}
.out{text-align:center;margin-top:18px}
.out button{font-size:12px;color:var(--dim);letter-spacing:.08em}
</style>
</head>
<body>
<div class="wrap">

  <div id="vLogin" class="hide">
    <div class="top"><div class="mono">W</div></div>
    <div class="card">
      <h3>INLOGGEN</h3>
      <form id="loginForm" method="post" action="#" autocomplete="on">
        <input id="email" name="email" type="email" placeholder="e-mail"
               autocomplete="username" inputmode="email" autocapitalize="none"
               autocorrect="off" spellcheck="false" required>
        <input id="password" name="password" type="password" placeholder="wachtwoord"
               autocomplete="current-password" required>
        <div class="err" id="loginErr"></div>
        <button class="primary" type="submit">Inloggen</button>
      </form>
      <p class="note">Zelfde account als je uren- en finance-app. Je Mac zet de metrics
        in Supabase; deze app leest ze alleen.</p>
    </div>
  </div>

  <div id="vApp" class="hide">
    <div class="top">
      <div class="mono">W</div>
      <div class="nav">
        <button id="prev">&#8249;</button><b id="hDate">VANDAAG</b><button id="next">&#8250;</button>
      </div>
      <div class="batt" id="batt"></div>
    </div>
    <div class="tabs">
      <button data-t="over" class="on">OVERZICHT</button>
      <button data-t="gez">GEZONDHEID</button>
    </div>
    <div id="body"></div>
    <div class="out"><button id="btnOut">UITLOGGEN</button></div>
  </div>

  <div id="vLoad" class="center">Laden&hellip;</div>
</div>

<script>
const SB_URL = "https://zxlythycfgpqwpquuswg.supabase.co";
const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4bHl0aHljZmdwcXdwcXV1c3dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NTIyOTcsImV4cCI6MjEwMDUyODI5N30.tDSW5jnnB--mltLEpEsmtVgiN6ALixsV3XWxYkJZ014";
const KEY = "whoop.session";
const SLEEP_TARGET = 480;          // 8 uur; pas aan naar je eigen behoefte

let session = null, rows = [], idx = 0, tab = "over";
try { session = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){}

const $ = s => document.querySelector(s);
const show = id => ["vLogin","vApp","vLoad"].forEach(v =>
  $("#"+v).classList.toggle("hide", v !== id));
const saveSession = s => { session = s; try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} };
const clearSession = () => { session = null; try{ localStorage.removeItem(KEY); }catch(e){} };

async function refreshSession(){
  if(!session || !session.refresh_token) throw new Error("geen sessie");
  const r = await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token", {
    method:"POST", headers:{apikey:SB_ANON,"Content-Type":"application/json"},
    body: JSON.stringify({refresh_token: session.refresh_token})});
  if(!r.ok) throw new Error("sessie verlopen");
  const d = await r.json();
  saveSession({access_token:d.access_token, refresh_token:d.refresh_token, user_id:d.user.id});
}

async function api(path){
  const go = () => fetch(SB_URL+"/rest/v1"+path,
    {headers:{apikey:SB_ANON, Authorization:"Bearer "+session.access_token}});
  let res = await go();
  if(res.status === 401){ await refreshSession(); res = await go(); }
  if(!res.ok){
    let msg = "";
    try { const j = await res.json(); msg = j.message || j.hint || j.details || ""; }
    catch(e){}
    const err = new Error(msg || ("HTTP " + res.status));
    err.status = res.status;
    throw err;
  }
  return res.json();
}

function toonFout(e){
  const mist = e.status === 404 && /whoop_days/.test(e.message || "");
  $("#body").innerHTML = mist
    ? `<div class="card"><h3>TABEL BESTAAT NOG NIET</h3>
        <p style="color:var(--muted);font-size:14.5px;margin:0 0 12px">
        De tabel <code>whoop_days</code> staat nog niet in je Supabase-project.
        Open de SQL Editor en draai <code>supabase-schema.sql</code> uit
        <code>whoop-tracker/</code>. Daarna hier op ververs tikken.</p>
        <p class="note" style="margin:0">${e.message}</p></div>`
    : `<div class="card"><h3>ER GING IETS MIS</h3>
        <p style="color:var(--muted);font-size:14.5px;margin:0">${e.message}</p></div>`;
  show("vApp");
}

/* ---------- ring ---------- */

function ring(pct, big, colour, label, text, sub){
  const S = big ? 118 : 106, R = big ? 48 : 43, SW = big ? 8 : 7;
  const C = 2*Math.PI*R, off = C * (1 - Math.max(0,Math.min(100,pct))/100);
  const c = S/2;
  return `<div class="rw"><svg viewBox="0 0 ${S} ${S}">
    <circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="#26292e" stroke-width="${SW}"/>
    <circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="${colour}" stroke-width="${SW}"
      stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${c} ${c})"/>
    <text class="v" x="${c}" y="${c+(sub?2:6)}" text-anchor="middle"
      font-size="${big?25:22}">${text}${sub?`<tspan class="p" font-size="${big?13:11}">${sub}</tspan>`:""}</text>
  </svg><div class="cap">${label}</div></div>`;
}

const recCol = p => p >= 67 ? "var(--green)" : p >= 34 ? "var(--yellow)" : "var(--red)";

/* ---------- baseline-bereik uit de geladen dagen ---------- */

function gemiddelde(key, behalve){
  const v = rows.filter(r => r.day !== behalve).map(r => r[key]).filter(x => x != null);
  if (v.length < 2) return null;
  return v.reduce((a, b) => a + b, 0) / v.length;
}

function range(key){
  const v = rows.map(r => r[key]).filter(x => x != null);
  if(v.length < 7) return null;
  const m = v.reduce((a,b)=>a+b,0)/v.length;
  const sd = Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/v.length) || 0.1;
  return [m-sd, m+sd];
}

/* raw = de waarde in dezelfde eenheid als de kolom (dus slaap in minuten),
   fmt = hoe je een grenswaarde toont. Die twee uit elkaar houden voorkomt
   dat je 7.1 uur vergelijkt met een bereik van 378 minuten. */
function badge(raw, key, hoogIsGoed, fmt){
  if(raw == null) return `<span class="badge off">nog geen data</span>`;
  const r = range(key);
  if(!r) return `<span class="badge off">baseline opbouwen</span>`;
  const [lo, hi] = r;
  if(raw >= lo && raw <= hi) return `<span class="badge">binnen ${fmt(lo)}–${fmt(hi)}</span>`;
  const hoog = raw > hi, goed = hoog === !!hoogIsGoed;
  return `<span class="badge ${goed?"":"warn"}">${hoog?"verhoogd":"verlaagd"} ${hoog?"&gt;":"&lt;"} ${fmt(hoog?hi:lo)}</span>`;
}

function tile(lab, toon, unit, key, hoogIsGoed, raw, fmt){
  const v = toon == null ? `<div class="val na">&mdash;</div>`
                         : `<div class="val">${toon}<small> ${unit}</small></div>`;
  return `<div class="tile"><div class="lab">${lab}</div>${v}
    ${badge(raw, key, hoogIsGoed, fmt || (x => x.toFixed(1)))}</div>`;
}

/* ---------- grafiek ---------- */

function chart(curve){
  if(!curve || curve.length < 2) return "";
  const W=500,H=120,pl=4,pb=15;
  const ys=curve.map(p=>p[1]), xs=curve.map(p=>p[0]);
  const y0=Math.min(...ys)-2, y1=Math.max(...ys)+2, x0=Math.min(...xs), x1=Math.max(...xs)||x0+1;
  const px=t=>pl+(t-x0)/((x1-x0)||1)*(W-pl*2), py=v=>4+(1-(v-y0)/((y1-y0)||1))*(H-pb-8);
  const pts=curve.map(p=>px(p[0]).toFixed(1)+","+py(p[1]).toFixed(1)).join(" ");
  const hhmm=t=>new Date(t*1000).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polygon class="ar" points="${px(x0)},${H-pb} ${pts} ${px(x1)},${H-pb}"/>
    <polyline class="ln" points="${pts}"/>
    <text x="${pl}" y="${H-2}">${hhmm(x0)}</text>
    <text x="${W-pl}" y="${H-2}" text-anchor="end">${hhmm(x1)}</text>
    <text x="${pl}" y="11">${Math.round(y1)} bpm</text></svg>`;
}

const uur = m => m == null ? null
  : (m>=60 ? Math.floor(m/60)+" <small>u</small> "+String(m%60).padStart(2,"0")+" <small>m</small>"
           : m+" <small>m</small>");

function advies(d, slaapPct){
  if(d.recovery == null)
    return ["Baseline wordt opgebouwd",
      `Je hebt ${d.baseline_days||0} van de 7 nachten binnen. Een herstelscore is een
       vergelijking met jouw normaal — zonder dat normaal zou elk getal verzonnen zijn.`];
  if(d.recovery >= 67)
    return ["Goed hersteld",
      `Je zit boven je eigen normaal. Je lichaam kan vandaag een flinke belasting aan;
       gisteren haalde je ${(d.strain21||0).toFixed(1)} van de 21.`];
  if(d.recovery >= 34)
    return ["Rond je normaal",
      `Niets bijzonders aan de hand. Een gemiddelde dag traint prima,
       maar een persoonlijk record zou ik niet plannen.`];
  return ["Onder je normaal",
    `Je HRV ligt duidelijk lager dan je gewoonlijk hebt${slaapPct<80?" en je sliep kort":""}.
     Houd het rustig — dit is precies waar zo'n meting voor bedoeld is.`];
}

/* ---------- weergeven ---------- */

function render(){
  if(!rows.length){
    $("#body").innerHTML = `<div class="card"><div class="center">Nog geen gegevens.<br><br>
      Draai op je Mac:<br><code style="color:var(--ink);font-size:12.5px">python3 whoop_push.py --age 23</code>
      </div></div>`;
    return;
  }
  const d = rows[idx];

  const today = new Date().toISOString().slice(0,10);
  $("#hDate").textContent = d.day === today ? "VANDAAG"
    : new Date(d.day+"T12:00:00").toLocaleDateString("nl-NL",
        {weekday:"short",day:"numeric",month:"short"}).toUpperCase();
  $("#prev").disabled = idx >= rows.length-1;
  $("#next").disabled = idx <= 0;
  if(d.battery != null){
    const pct = Math.max(0, Math.min(100, d.battery));
    const cls = pct < 15 ? "crit" : pct < 30 ? "low" : "";
    // 3px is de rand plus padding; de rest is vulhoogte
    $("#batt").innerHTML = `${Math.round(pct)}% <i><b class="${cls}"
      style="height:calc((100% - 3px) * ${(pct/100).toFixed(3)})"></b></i>`;
  } else $("#batt").innerHTML = "";

  const slaapPct = d.sleep_min != null
    ? Math.min(100, d.sleep_min / SLEEP_TARGET * 100) : null;

  let h = "";
  if(tab === "over"){
    h += `<div class="rings">
      ${ring(slaapPct==null?0:slaapPct, false, "var(--sleep)", "SLAAP",
             slaapPct==null?"&mdash;":Math.round(slaapPct), slaapPct==null?"":"%")}
      ${ring(d.recovery==null?0:d.recovery, true,
             d.recovery==null?"#26292e":recCol(d.recovery), "HERSTEL",
             d.recovery==null?"&mdash;":Math.round(d.recovery), d.recovery==null?"":"%")}
      ${ring(Math.min(100,(d.strain21||0)/21*100), false, "var(--blue)", "BELASTING",
             (d.strain21||0).toFixed(1), "")}
    </div>`;

    const [kop, tekst] = advies(d, slaapPct||0);
    h += `<div class="card coach"><b>${kop}</b><p>${tekst}</p></div>`;

    if(d.hr_curve && d.hr_curve.length>1)
      h += `<div class="card"><h3>HARTSLAG</h3>${chart(d.hr_curve)}
        <div class="sub">gem ${Math.round(d.hr_avg)} &middot; ${Math.round(d.hr_min)}–${Math.round(d.hr_max)} bpm
        &middot; ${d.worn_min||0} min gedragen</div></div>`;

    const wk = rows.slice(0,7).reverse();
    if(wk.length>1){
      const mx = Math.max(...wk.map(r=>r.recovery||0), 1);
      h += `<div class="card"><h3>HERSTEL PER DAG</h3><div class="week">${wk.map(r=>{
        const c = r.recovery!=null ? recCol(r.recovery) : "var(--card2)";
        return `<div style="height:${Math.max(4,(r.recovery||0)/mx*72)}px;background:${c}"></div>`;
      }).join("")}</div><div class="wdays">${wk.map(r=>
        `<span>${new Date(r.day+"T12:00:00").toLocaleDateString("nl-NL",{weekday:"short"}).slice(0,2)}</span>`
      ).join("")}</div></div>`;
    }
  } else {
    h += `<div class="hero"><div class="bpm">
      <div class="h">&#9829;</div>
      <div class="n">${d.hr_avg!=null?Math.round(d.hr_avg):"&mdash;"}</div>
      <div class="u">BPM</div></div></div>`;
    h += `<h3 style="margin:0 2px 13px;font-size:11px;letter-spacing:.11em;color:var(--muted)">
      METINGEN VAN VANNACHT</h3>`;
    h += `<div class="tiles">
      ${tile("ADEMHALING", d.resp_rate!=null?d.resp_rate.toFixed(1):null, "rpm",
             "resp_rate", false, d.resp_rate)}
      ${tile("ZUURSTOF", d.spo2!=null?Math.round(d.spo2):null, "%",
             "spo2", true, d.spo2, x => Math.round(x)+"%")}
      ${tile("RUSTHARTSLAG", d.rhr!=null?Math.round(d.rhr):null, "bpm",
             "rhr", false, d.rhr, x => Math.round(x))}
      ${tile("HRV", d.hrv_rmssd!=null?Math.round(d.hrv_rmssd):null, "ms",
             "hrv_rmssd", true, d.hrv_rmssd, x => Math.round(x))}
      ${(() => {
        // De sensor levert een ruwe, relatieve waarde - geen graden. Betekenis
        // krijgt hij pas als afwijking van je eigen nachten, en dat is ook wat
        // Whoop toont. Richting geijkt op 27-08: warmte laat hem stijgen.
        const basis = gemiddelde("skin_temp", d.day);
        if (d.skin_temp == null)
          return tile("HUIDTEMP", null, "", "skin_temp", false, null);
        if (!basis) {
          const heb = rows.filter(r => r.day !== d.day && r.skin_temp != null).length;
          return `<div class="tile"><div class="lab">HUIDTEMP</div>
            <div class="val">${Math.round(d.skin_temp)}</div>
            <span class="badge off">nog ${2 - heb} nacht${2 - heb === 1 ? "" : "en"} nodig</span></div>`;
        }
        const afw = (d.skin_temp - basis) / basis * 100;
        return tile("HUIDTEMP", (afw > 0 ? "+" : "") + afw.toFixed(1), "%",
                    "skin_temp", false, d.skin_temp,
                    x => { const p = (x - basis) / basis * 100;
                           return (p > 0 ? "+" : "") + p.toFixed(1) + "%"; });
      })()}
      ${tile("SLAAP", d.sleep_min!=null?(d.sleep_min/60).toFixed(1):null, "u",
             "sleep_min", true, d.sleep_min, x => (x/60).toFixed(1)+" u")}
    </div>`;
    h += `<div class="card" style="margin-top:11px"><p class="note" style="border:0;padding:0;margin:0">
      <b style="color:var(--ink)">Huidtemperatuur</b> is een afwijking van je eigen
      nachten, niet een temperatuur in graden: de sensor levert een relatieve waarde die
      Whoop in de cloud omrekent. Dat hij stijgt bij warmte is geijkt op een sauna-meting.
      Gemeten tijdens je slaap, want dan verstoren kleding en beweging het minst.<br><br>
      <b style="color:var(--ink)">Ademhaling</b> komt uit je hartslag zelf: die versnelt
      bij inademen en vertraagt bij uitademen, dus de ademhaling zit als golf in je
      R-R-intervallen. Alleen vensters met een duidelijke piek tellen mee.<br><br>
      <b style="color:var(--ink)">Zuurstof</b> ontbreekt en gaat er ook niet komen: dat
      vereist de hartslaggolf op 25 Hz of hoger, terwijl de historie één meting per
      seconde levert. Die informatie is er simpelweg niet. Alle bereiken komen uit je
      eigen laatste 30 dagen, niet uit een bevolkingsgemiddelde.</p></div>`;
  }

  $("#body").innerHTML = h;
}

/* ---------- start ---------- */

async function loadData(){
  rows = await api("/whoop_days?select=*&order=day.desc&limit=30");
  idx = 0; render(); show("vApp");
}

async function boot(){
  show("vLoad");
  if(!session){ show("vLogin"); return; }
  try { await loadData(); }
  catch(e){
    // Alleen een auth-probleem rechtvaardigt uitloggen. Een ontbrekende tabel
    // of een serverfout moet je zien, niet naar het inlogscherm terugsturen.
    if(e.status && e.status !== 401 && e.status !== 403){ toonFout(e); return; }
    try { await refreshSession(); await loadData(); }
    catch(e2){ clearSession(); show("vLogin"); }
  }
}

$("#loginForm").addEventListener("submit", async ev => {
  ev.preventDefault(); $("#loginErr").textContent = "";
  try{
    const r = await fetch(SB_URL+"/auth/v1/token?grant_type=password", {
      method:"POST", headers:{apikey:SB_ANON,"Content-Type":"application/json"},
      body: JSON.stringify({email:$("#email").value.trim(), password:$("#password").value})});
    if(!r.ok) throw new Error("Inloggen mislukt");
    const d = await r.json();
    saveSession({access_token:d.access_token, refresh_token:d.refresh_token, user_id:d.user.id});
    // Het wachtwoordveld NIET meteen leegmaken: Safari en de Wachtwoorden-app
    // bieden pas aan om op te slaan nadat ze een geslaagde inzending zien, en
    // een veld dat al leeg is telt niet mee. Leegmaken gebeurt bij uitloggen.
    try { await loadData(); }
    catch(e2){ if(e2.status) toonFout(e2); else throw e2; }
  }catch(e){ $("#loginErr").textContent = e.message; }
});

$("#prev").addEventListener("click", () => { if(idx < rows.length-1){ idx++; render(); }});
$("#next").addEventListener("click", () => { if(idx > 0){ idx--; render(); }});
document.querySelectorAll(".tabs button").forEach(b =>
  b.addEventListener("click", () => {
    tab = b.dataset.t;
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
    render();
  }));
$("#btnOut").addEventListener("click", () => {
  clearSession();
  $("#password").value = "";
  show("vLogin");
});

boot();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
